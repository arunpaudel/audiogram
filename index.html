<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Audiogram Studio (16:9)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#fafafa] text-neutral-900 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const HONEYCOMB_COLORS = [
      '#FFFFFF', '#E2E8F0', '#94A3B8', '#475569', '#1E293B', '#000000',
      '#EF4444', '#F97316', '#F59E0B', '#EAB308', '#84CC16', '#22C55E',
      '#10B981', '#14B8A6', '#06B6D4', '#0EA5E9', '#3B82F6', '#6366F1',
      '#8B5CF6', '#A855F7', '#D946EF', '#EC4899', '#F43F5E', '#FB7185',
      '#FDE047', '#A7F3D0', '#7DD3FC', '#C4B5FD', '#FBCFE8', '#FCA5A5'
    ];

    function App() {
      const [audioFile, setAudioFile] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [waveType, setWaveType] = useState('bars'); // 'bars' | 'wave' | 'circle'
      const [waveColor, setWaveColor] = useState('#171717');
      const [barCount, setBarCount] = useState(48);
      const [waveScale, setWaveScale] = useState(1.2);

      // Progress bar & spacing states
      const [showProgress, setShowProgress] = useState(true);
      const [sameAsWave, setSameAsWave] = useState(true);
      const [progressColor, setProgressColor] = useState('#171717');
      const [progressHeight, setProgressHeight] = useState(8);
      const [spacingOffset, setSpacingOffset] = useState(240); // Distance below waveform

      // Time stamp states
      const [showTimestamp, setShowTimestamp] = useState(true);
      const [timestampSize, setTimestampSize] = useState(24); // Font size in px
      const [currentTimeStr, setCurrentTimeStr] = useState('0:00');
      const [totalTimeStr, setTotalTimeStr] = useState('0:00');

      // Export & display states
      const [useGreenScreen, setUseGreenScreen] = useState(false);
      const [isExporting, setIsExporting] = useState(false);
      const [exportProgress, setExportProgress] = useState(0);

      // Active color picker modal
      const [activePalette, setActivePalette] = useState(null); // 'wave' | 'progress' | null

      const canvasRef = useRef(null);
      const audioRef = useRef(null);
      const audioCtxRef = useRef(null);
      const analyserRef = useRef(null);
      const sourceRef = useRef(null);
      const animationFrameRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const recordedChunksRef = useRef([]);

      // Fixed 16:9 Full HD Dimensions
      const dimensions = { width: 1920, height: 1080 };

      const formatTime = (secs) => {
        if (!secs || isNaN(secs)) return '0:00';
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const setupAudio = (file) => {
        if (!audioCtxRef.current) {
          audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        const ctx = audioCtxRef.current;
        if (ctx.state === 'suspended') ctx.resume();

        if (!analyserRef.current) {
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 256;
          analyserRef.current = analyser;
        }

        const url = URL.createObjectURL(file);
        if (audioRef.current) {
          audioRef.current.src = url;
          if (!sourceRef.current) {
            sourceRef.current = ctx.createMediaElementSource(audioRef.current);
            sourceRef.current.connect(analyserRef.current);
            analyserRef.current.connect(ctx.destination);
          }
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          setAudioFile(file);
          setupAudio(file);
        }
      };

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (audioCtxRef.current?.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play();
          setIsPlaying(true);
        }
      };

      // Realtime Drawing Engine
      const draw = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const { width, height } = dimensions;

        if (useGreenScreen) {
          ctx.fillStyle = '#00FF00';
          ctx.fillRect(0, 0, width, height);
        } else {
          ctx.clearRect(0, 0, width, height);
        }

        let freqData = new Uint8Array(32);
        if (analyserRef.current && isPlaying) {
          freqData = new Uint8Array(analyserRef.current.frequencyBinCount);
          analyserRef.current.getByteFrequencyData(freqData);
        }

        const cx = width / 2;
        const cy = height / 2;

        // Draw Waveform
        if (waveType === 'bars') {
          const barWidth = (width * 0.72) / barCount;
          const startX = (width - width * 0.72) / 2;
          ctx.fillStyle = waveColor;

          for (let i = 0; i < barCount; i++) {
            const rawVal = freqData[i % freqData.length] || 4;
            const h = Math.max(8, (rawVal / 255) * 320 * waveScale);
            const x = startX + i * barWidth;
            const y = cy - h / 2;

            ctx.beginPath();
            ctx.roundRect(x, y, barWidth * 0.65, h, 6);
            ctx.fill();
          }
        } else if (waveType === 'wave') {
          ctx.beginPath();
          ctx.strokeStyle = waveColor;
          ctx.lineWidth = 10;
          ctx.lineCap = 'round';
          const sliceWidth = (width * 0.75) / barCount;
          const startX = (width - width * 0.75) / 2;

          for (let i = 0; i < barCount; i++) {
            const val = ((freqData[i % freqData.length] || 6) / 255) * 200 * waveScale;
            const x = startX + i * sliceWidth;
            const y = cy + (i % 2 === 0 ? -val : val);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        } else if (waveType === 'circle') {
          const radius = height * 0.22;
          ctx.strokeStyle = waveColor;
          ctx.lineWidth = 6;

          for (let i = 0; i < barCount; i++) {
            const angle = (i / barCount) * Math.PI * 2;
            const val = ((freqData[i % freqData.length] || 4) / 255) * 140 * waveScale;
            const x1 = cx + Math.cos(angle) * radius;
            const y1 = cy + Math.sin(angle) * radius;
            const x2 = cx + Math.cos(angle) * (radius + val);
            const y2 = cy + Math.sin(angle) * (radius + val);

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
          }
        }

        const activeBarColor = sameAsWave ? waveColor : progressColor;

        // Progress Bar & Spacing Calculation
        if (showProgress) {
          const curTime = audioRef.current?.currentTime || 0;
          const dur = audioRef.current?.duration || 1;
          const pct = Math.min(1, Math.max(0, curTime / dur));

          const barW = width * 0.72;
          const barX = (width - barW) / 2;
          const barY = cy + spacingOffset;
          const radius = Math.min(progressHeight / 2, 8);

          // Track
          ctx.fillStyle = useGreenScreen ? 'rgba(0, 0, 0, 0.25)' : 'rgba(150, 150, 150, 0.3)';
          ctx.beginPath();
          ctx.roundRect(barX, barY, barW, progressHeight, radius);
          ctx.fill();

          // Progress fill
          ctx.fillStyle = activeBarColor;
          ctx.beginPath();
          ctx.roundRect(barX, barY, Math.max(progressHeight, barW * pct), progressHeight, radius);
          ctx.fill();

          // Time Counters
          if (showTimestamp) {
            ctx.fillStyle = activeBarColor;
            ctx.font = `600 ${timestampSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
            ctx.textBaseline = 'middle';

            const textYOffset = barY + progressHeight + timestampSize * 0.8 + 10;

            // Left (Current Time)
            ctx.textAlign = 'left';
            ctx.fillText(formatTime(curTime), barX, textYOffset);

            // Right (Total Duration)
            ctx.textAlign = 'right';
            ctx.fillText(formatTime(dur), barX + barW, textYOffset);
          }
        }

        animationFrameRef.current = requestAnimationFrame(draw);
      };

      useEffect(() => {
        animationFrameRef.current = requestAnimationFrame(draw);
        return () => cancelAnimationFrame(animationFrameRef.current);
      }, [waveType, waveColor, barCount, waveScale, showProgress, sameAsWave, progressColor, progressHeight, spacingOffset, showTimestamp, timestampSize, useGreenScreen, isPlaying]);

      const handleTimeUpdate = () => {
        if (audioRef.current) {
          setCurrentTimeStr(formatTime(audioRef.current.currentTime));
          setTotalTimeStr(formatTime(audioRef.current.duration));
        }
      };

      // Video Export
      const startExport = () => {
        if (!audioRef.current || !canvasRef.current) return;
        setIsExporting(true);
        setExportProgress(0);

        const canvas = canvasRef.current;
        const stream = canvas.captureStream(30);

        if (audioCtxRef.current) {
          const dest = audioCtxRef.current.createMediaStreamDestination();
          sourceRef.current.connect(dest);
          stream.addTrack(dest.stream.getAudioTracks()[0]);
        }

        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
          ? 'video/webm;codecs=vp9'
          : 'video/webm';

        const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
        recordedChunksRef.current = [];

        recorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunksRef.current.push(e.data);
        };

        recorder.onstop = () => {
          const blob = new Blob(recordedChunksRef.current, { type: mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `audiogram_overlay_16_9.webm`;
          a.click();
          setIsExporting(false);
        };

        mediaRecorderRef.current = recorder;
        audioRef.current.currentTime = 0;
        audioRef.current.play();
        setIsPlaying(true);
        recorder.start();

        audioRef.current.ontimeupdate = () => {
          if (audioRef.current) {
            handleTimeUpdate();
            setExportProgress(Math.round((audioRef.current.currentTime / audioRef.current.duration) * 100));
          }
        };

        audioRef.current.onended = () => {
          recorder.stop();
          setIsPlaying(false);
        };
      };

      return (
        <div className="max-w-md mx-auto p-4 flex flex-col gap-4 pb-24">
          <header className="border-b border-neutral-200 pb-3 flex justify-between items-center">
            <div>
              <h1 className="text-base font-semibold tracking-tight text-neutral-900">Audiogram Studio</h1>
              <p className="text-xs text-neutral-500">1080p (16:9) Overlay Generator</p>
            </div>
            <span className="text-[10px] px-2 py-0.5 rounded-full border border-neutral-300 font-mono text-neutral-600">16:9</span>
          </header>

          {/* Audio Upload */}
          <div className="bg-white border border-neutral-200 rounded-xl p-3 shadow-sm">
            <label className="block text-xs font-medium text-neutral-600 mb-1">Select Audio Track</label>
            <input 
              type="file" 
              accept="audio/*" 
              onChange={handleFileUpload} 
              className="text-xs w-full file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-neutral-900 file:text-white"
            />
            <audio 
              ref={audioRef} 
              onTimeUpdate={handleTimeUpdate} 
              onLoadedMetadata={handleTimeUpdate}
              onEnded={() => setIsPlaying(false)} 
              className="hidden" 
            />
          </div>

          {/* Preview Canvas (Fixed 16:9) */}
          <div className={`relative border border-neutral-300 rounded-xl overflow-hidden aspect-video flex items-center justify-center ${useGreenScreen ? 'bg-[#00FF00]' : 'bg-[radial-gradient(#e5e5e5_1px,transparent_1px)] [background-size:16px_16px] bg-white'}`}>
            <canvas 
              ref={canvasRef} 
              width={dimensions.width} 
              height={dimensions.height}
              className="w-full h-full object-contain"
            />
          </div>

          {/* Play & Export Buttons */}
          <div className="flex gap-2">
            <button 
              onClick={togglePlay}
              disabled={!audioFile || isExporting}
              className="flex-1 py-2.5 rounded-xl bg-neutral-900 text-white text-xs font-medium disabled:opacity-40"
            >
              {isPlaying ? 'Pause Preview' : 'Play Preview'}
            </button>
            <button 
              onClick={startExport}
              disabled={!audioFile || isExporting}
              className="flex-1 py-2.5 rounded-xl border border-neutral-900 text-neutral-900 text-xs font-medium disabled:opacity-40"
            >
              {isExporting ? `Rendering (${exportProgress}%)` : 'Export 1080p'}
            </button>
          </div>

          {/* Customization Dashboard */}
          <div className="bg-white border border-neutral-200 rounded-xl p-4 shadow-sm space-y-4">

            {/* Waveform Selector */}
            <div>
              <label className="text-xs font-medium text-neutral-600 block mb-1.5">Waveform Style</label>
              <div className="grid grid-cols-3 gap-2">
                {[
                  { id: 'bars', label: 'Bars' },
                  { id: 'wave', label: 'Curve' },
                  { id: 'circle', label: 'Radial' }
                ].map(item => (
                  <button 
                    key={item.id}
                    onClick={() => setWaveType(item.id)}
                    className={`py-1.5 text-xs rounded-lg border ${waveType === item.id ? 'border-neutral-900 bg-neutral-900 text-white' : 'border-neutral-200 text-neutral-600'}`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>
            </div>

            {/* Wave Color */}
            <div>
              <div className="flex justify-between items-center mb-1">
                <label className="text-xs font-medium text-neutral-600">Wave Color</label>
                <span className="text-[11px] font-mono text-neutral-500">{waveColor}</span>
              </div>
              <button 
                onClick={() => setActivePalette(activePalette === 'wave' ? null : 'wave')}
                className="w-full flex items-center justify-between p-2 rounded-lg border border-neutral-200 hover:border-neutral-400 bg-neutral-50"
              >
                <div className="flex items-center gap-2">
                  <div className="w-5 h-5 rounded-full border border-neutral-300 shadow-sm" style={{ backgroundColor: waveColor }} />
                  <span className="text-xs font-medium text-neutral-700">Choose from Palette Wheel</span>
                </div>
                <span className="text-xs text-neutral-400">{activePalette === 'wave' ? 'Close' : 'Select'}</span>
              </button>

              {activePalette === 'wave' && (
                <div className="mt-2 p-3 bg-neutral-50 border border-neutral-200 rounded-xl grid grid-cols-6 gap-2 place-items-center">
                  {HONEYCOMB_COLORS.map(color => (
                    <button
                      key={color}
                      onClick={() => { setWaveColor(color); setActivePalette(null); }}
                      className="w-7 h-7 rounded-full border border-black/10 shadow-sm active:scale-90 transition-transform"
                      style={{ backgroundColor: color }}
                    />
                  ))}
                </div>
              )}
            </div>

            {/* Output Background Mode */}
            <div>
              <label className="text-xs font-medium text-neutral-600 block mb-1">Overlay Mode</label>
              <button 
                onClick={() => setUseGreenScreen(!useGreenScreen)}
                className={`w-full py-2 px-3 text-xs rounded-lg border font-medium flex items-center justify-between ${useGreenScreen ? 'border-green-600 bg-green-50 text-green-700' : 'border-neutral-200 text-neutral-700'}`}
              >
                <span>{useGreenScreen ? 'Chroma Key Green (#00FF00)' : 'Transparent Alpha (WebM)'}</span>
                <span className="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-white/70 border border-current">
                  {useGreenScreen ? 'Green Screen' : 'Transparent'}
                </span>
              </button>
            </div>

            {/* Progress Bar & Spacing Section */}
            <div className="border-t border-neutral-100 pt-3 space-y-3">
              <div className="flex justify-between items-center">
                <span className="text-xs font-medium text-neutral-800">Progress Bar</span>
                <input 
                  type="checkbox" 
                  checked={showProgress} 
                  onChange={(e) => setShowProgress(e.target.checked)}
                  className="rounded text-neutral-900 focus:ring-0 w-4 h-4 cursor-pointer"
                />
              </div>

              {showProgress && (
                <div className="space-y-3 pl-2 border-l-2 border-neutral-100">
                  {/* Same as Wave Checkbox */}
                  <label className="flex items-center gap-2 text-xs text-neutral-700 cursor-pointer">
                    <input 
                      type="checkbox" 
                      checked={sameAsWave} 
                      onChange={(e) => setSameAsWave(e.target.checked)}
                      className="rounded text-neutral-900 focus:ring-0"
                    />
                    <span>Same color as waveform</span>
                  </label>

                  {/* Custom Color Picker if not same as wave */}
                  {!sameAsWave && (
                    <div>
                      <button 
                        onClick={() => setActivePalette(activePalette === 'progress' ? null : 'progress')}
                        className="w-full flex items-center justify-between p-2 rounded-lg border border-neutral-200 bg-neutral-50 text-xs"
                      >
                        <div className="flex items-center gap-2">
                          <div className="w-4 h-4 rounded-full border border-neutral-300" style={{ backgroundColor: progressColor }} />
                          <span>Progress Color</span>
                        </div>
                        <span className="text-neutral-400 font-mono">{progressColor}</span>
                      </button>

                      {activePalette === 'progress' && (
                        <div className="mt-2 p-3 bg-neutral-50 border border-neutral-200 rounded-xl grid grid-cols-6 gap-2 place-items-center">
                          {HONEYCOMB_COLORS.map(color => (
                            <button
                              key={color}
                              onClick={() => { setProgressColor(color); setActivePalette(null); }}
                              className="w-7 h-7 rounded-full border border-black/10 shadow-sm active:scale-90 transition-transform"
                              style={{ backgroundColor: color }}
                            />
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* Progress Bar Thickness Slider */}
                  <div>
                    <div className="flex justify-between text-[11px] text-neutral-500 mb-1">
                      <span>Bar Thickness</span>
                      <span className="font-mono">{progressHeight}px</span>
                    </div>
                    <input 
                      type="range" 
                      min="2" 
                      max="30" 
                      step="1"
                      value={progressHeight} 
                      onChange={(e) => setProgressHeight(Number(e.target.value))} 
                      className="w-full accent-neutral-900"
                    />
                  </div>

                  {/* Manual Spacing Adjustment */}
                  <div>
                    <div className="flex justify-between text-[11px] text-neutral-500 mb-1">
                      <span>Waveform & Bar Spacing</span>
                      <span className="font-mono">{spacingOffset}px</span>
                    </div>
                    <input 
                      type="range" 
                      min="100" 
                      max="450" 
                      step="5"
                      value={spacingOffset} 
                      onChange={(e) => setSpacingOffset(Number(e.target.value))} 
                      className="w-full accent-neutral-900"
                    />
                  </div>

                  {/* Time Counters Toggle & Font Size */}
                  <div className="pt-1 space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="text-xs text-neutral-700">Display Timestamps ({currentTimeStr} / {totalTimeStr})</span>
                      <input 
                        type="checkbox" 
                        checked={showTimestamp} 
                        onChange={(e) => setShowTimestamp(e.target.checked)}
                        className="rounded text-neutral-900 focus:ring-0 w-4 h-4 cursor-pointer"
                      />
                    </div>

                    {showTimestamp && (
                      <div>
                        <div className="flex justify-between text-[11px] text-neutral-500 mb-1">
                          <span>Timestamp Font Size</span>
                          <span className="font-mono">{timestampSize}px</span>
                        </div>
                        <input 
                          type="range" 
                          min="14" 
                          max="64" 
                          step="2"
                          value={timestampSize} 
                          onChange={(e) => setTimestampSize(Number(e.target.value))} 
                          className="w-full accent-neutral-900"
                        />
                      </div>
                    )}
                  </div>

                </div>
              )}
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
